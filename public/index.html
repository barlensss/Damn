<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D Portfolio • Dashboard</title>
<link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- Background 3D -->
<div class="scene">
  <div class="cube">
    <div class="face front"></div>
    <div class="face back"></div>
    <div class="face left"></div>
    <div class="face right"></div>
    <div class="face top"></div>
    <div class="face bottom"></div>
  </div>
</div>

<!-- ================= AUTH SCREEN ================= -->
<div id="authScreen" class="screen active">
  <div class="glass-card">
    <h1 class="title-3d">PORTFOLIO <span>3D</span></h1>
    <p class="subtitle">Sign in / Register untuk masuk</p>

    <div class="tabs">
      <button id="tabLogin" class="tab active">Login</button>
      <button id="tabRegister" class="tab">Daftar</button>
    </div>

    <form id="formLogin" class="form active">
      <input id="loginUser" type="text" placeholder="Username / Email" required />
      <input id="loginPass" type="password" placeholder="Password" required />
      <button type="submit" class="btn-3d">Masuk</button>
    </form>

    <form id="formRegister" class="form">
      <input id="regUser" type="text" placeholder="Username / Email baru" required />
      <input id="regPass" type="password" placeholder="Password" required />
      <button type="submit" class="btn-3d">Daftar</button>
    </form>

    <div id="authMsg" class="msg"></div>
  </div>
</div>

<!-- ================= PORTFOLIO SCREEN ================= -->
<div id="portfolioScreen" class="screen">
  <div class="topbar">
    <div class="badge" id="userBadge">-</div>
    <button id="btnDashboard" class="btn-3d small">Dashboard</button>
    <button id="btnLogout" class="btn-3d small danger">Logout</button>
  </div>

  <div class="hero">
    <div class="glass-card hero-card">
      <h1 class="title-3d">HALO, <span id="heroName">-</span></h1>
      <p class="subtitle">Selamat datang di Portofolio 3D</p>

      <div class="cards">
        <div class="mini-card">
          <h3>💻 Web Dev</h3>
          <p>Frontend & Backend modern</p>
        </div>
        <div class="mini-card">
          <h3>🎨 UI / UX</h3>
          <p>Design interaktif 3D</p>
        </div>
        <div class="mini-card">
          <h3>⚙️ Backend</h3>
          <p>Node.js + Express + JSON</p>
        </div>
        <div class="mini-card">
          <h3>🚀 Deploy</h3>
          <p>Termux ready</p>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ================= DASHBOARD SCREEN ================= -->
<div id="dashboardScreen" class="screen">
  <div class="topbar">
    <button id="btnBack" class="btn-3d small">← Kembali</button>
    <div class="badge" id="dashBadge">-</div>
  </div>

  <div class="glass-card dash-card">
    <h2 class="title-3d">DASHBOARD</h2>
    <p class="subtitle" id="dashInfo">-</p>

    <!-- List akun -->
    <div id="userList" class="user-list"></div>

    <div class="role-tools" id="roleTools">
      <h3>Ubah Role</h3>
      <div class="row">
        <input id="roleTargetId" type="number" placeholder="ID user" />
        <select id="roleSelect">
          <option value="CEO">CEO</option>
          <option value="Moderator">Moderator</option>
          <option value="User">User</option>
        </select>
        <button id="btnSetRole" class="btn-3d small">Simpan</button>
      </div>
    </div>

    <div id="dashMsg" class="msg"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
  </html>
